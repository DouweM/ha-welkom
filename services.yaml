refresh:
  name: Refresh
  description: >-
    Refresh all Welkom coordinators immediately instead of waiting for the next
    poll. Called by the bundled frontend script after it registers activity for
    the viewing device.

set_device_suspended:
  name: Set device suspended
  description: >-
    Suspend or unsuspend a device's welkom current-device activity. While
    suspended, the device's claims and sustains are ignored and any slot it
    holds is released. Wire this to real-world device state — e.g. suspend a
    Mac when its companion app's Active sensor turns off — so a device that
    keeps rendering dashboards while nobody is at it can't hold the slot.
  fields:
    device:
      name: Device
      description: The welkom device display name (e.g. "Douwe's MBP").
      required: true
      example: "Douwe's MBP"
      selector:
        text:
    suspended:
      name: Suspended
      description: Whether the device should be suspended (defaults to true).
      default: true
      selector:
        boolean:

report_sighting:
  name: Report sighting
  description: >-
    Tell welkom a person was seen in a room of a home without a device, e.g. a
    keypad code or Home Key at the front door. welkom holds them there (15
    minutes) until a device of theirs shows up, and marks it `presence: door`
    on their entities so its expiry isn't read as leaving. Presence only: it
    never changes a role. Fails with welkom's reason when refused.
  fields:
    person:
      name: Person
      description: The welkom person id.
      required: true
      example: araceli
      selector:
        text:
    room:
      name: Room
      description: The welkom room id, in that home.
      required: true
      example: garage
      selector:
        text:
    at:
      name: At
      description: When they were seen, as a Unix timestamp. Defaults to now.
      example: 1792261932
      selector:
        number:
          mode: box
          step: any
    home:
      name: Home
      description: The welkom home id. Defaults to the integration's main home.
      example: oasis
      selector:
        text:
    source:
      name: Source
      description: What saw them. Only "door" for now.
      default: door
      selector:
        select:
          options:
            - door

locate:
  name: Locate
  description: >-
    Set where a roaming home (a travel router) is, by hand. Held like a phone's
    fix: for as long as the router stays on the uplink it is on now.
  target:
    entity:
      integration: welkom
      domain: device_tracker
  fields:
    latitude:
      name: Latitude
      required: true
      example: 40.7617
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      name: Longitude
      required: true
      example: -73.9880
      selector:
        number:
          min: -180
          max: 180
          step: any
    accuracy:
      name: Accuracy
      description: Radius in metres the router is within.
      default: 30
      selector:
        number:
          min: 0
          max: 5000
          unit_of_measurement: m
